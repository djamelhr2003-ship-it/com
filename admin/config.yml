backend:
  name: github
  repo: djamelhr2003/com
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "إدارة المنتجات"
    folder: "content/products"
    create: true
    fields:
      - {label: "اسم المنتج", name: "title", widget: "string"}
      - {label: "السعر (بالدينار)", name: "price", widget: "string"}
      - {label: "صورة المنتج", name: "image", widget: "image"}
      - {label: "وصف المنتج", name: "description", widget: "text"}
