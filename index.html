<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch3D™ | مخصص الملابس الواقعي</title>
    <!-- Tailwind CSS للتصميم الفاخر -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Three.js ومكتبات التحكم -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #canvas-container { width: 100%; height: 480px; position: relative; border-radius: 1.5rem; overflow: hidden; background: radial-gradient(circle, #1f2937 0%, #0b0f19 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- شريط التنقل العلوي -->
    <header class="glass-card sticky top-0 z-50 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <span class="text-2xl font-black bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">STITCH 3D</span>
            <a href="admin/" class="text-sm font-semibold bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-xl transition border border-gray-700">لوحة الإدارة</a>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto px-6 py-10 grid grid-cols-1 lg:grid-cols-12 gap-10 items-center flex-grow">
        
        <!-- قسم المعاينة والتحكم بالملابس ثلاثية الأبعاد (7 أعمدة) -->
        <div class="lg:col-span-7 glass-card p-6 rounded-3xl shadow-2xl relative space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-200">المعاينة الواقعية (تريكو / تيشيرت 360°)</h2>
                <span class="text-xs text-cyan-400 bg-cyan-950/60 px-3 py-1 rounded-lg border border-cyan-800/50">اسحب للتدوير</span>
            </div>
            
            <div id="canvas-container">
                <!-- شاشة عرض المجسم الواقعي -->
            </div>

            <!-- أداة التحكم الدقيق بمكان وحجم الشعار على القماش -->
            <div class="bg-gray-900/90 p-4 rounded-2xl border border-gray-800 space-y-3">
                <span class="text-xs font-bold text-indigo-400 block">تحكم في مكان وحجم الشعار على التيشيرت:</span>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div>
                        <label class="text-[11px] text-gray-400 block mb-1">الموضع أفقي (X)</label>
                        <input type="range" id="logoPosX" min="-0.6" max="0.6" step="0.05" value="0" class="w-full accent-indigo-500">
                    </div>
                    <div>
                        <label class="text-[11px] text-gray-400 block mb-1">الموضع عمودي (Y)</label>
                        <input type="range" id="logoPosY" min="-0.5" max="0.8" step="0.05" value="0.2" class="w-full accent-indigo-500">
                    </div>
                    <div>
                        <label class="text-[11px] text-gray-400 block mb-1">حجم الشعار (Scale)</label>
                        <input type="range" id="logoScale" min="0.3" max="2.0" step="0.1" value="0.9" class="w-full accent-indigo-500">
                    </div>
                    <div>
                        <label class="text-[11px] text-gray-400 block mb-1">تدوير الشعار</label>
                        <input type="range" id="logoRotate" min="-3.14" max="3.14" step="0.1" value="0" class="w-full accent-indigo-500">
                    </div>
                </div>
            </div>

            <!-- خيارات ألوان القماش الفورية -->
            <div class="flex items-center justify-between bg-gray-900/80 p-3 rounded-2xl border border-gray-800">
                <span class="text-xs font-medium text-gray-400">اختر لون القماش:</span>
                <div class="flex gap-3">
                    <button onclick="changeColor(0x312e81)" class="w-7 h-7 rounded-full bg-indigo-900 border-2 border-white/20 hover:scale-110 transition"></button>
                    <button onclick="changeColor(0x111827)" class="w-7 h-7 rounded-full bg-gray-900 border-2 border-white/20 hover:scale-110 transition"></button>
                    <button onclick="changeColor(0x991b1b)" class="w-7 h-7 rounded-full bg-red-800 border-2 border-white/20 hover:scale-110 transition"></button>
                    <button onclick="changeColor(0x065f46)" class="w-7 h-7 rounded-full bg-emerald-800 border-2 border-white/20 hover:scale-110 transition"></button>
                    <button onclick="changeColor(0xf3f4f6)" class="w-7 h-7 rounded-full bg-gray-100 border-2 border-white/20 hover:scale-110 transition"></button>
                </div>
            </div>
        </div>

        <!-- قسم تفاصيل المنتج ورفع الشعار ونموذج الطلب المرتبط بـ Web3Forms (5 أعمدة) -->
        <div class="lg:col-span-5 glass-card p-8 rounded-3xl shadow-2xl space-y-6">
            <div>
                <span class="text-xs font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-3 py-1 rounded-full">جودة عالية - تريكو / قطن</span>
                <h1 class="text-3xl font-black mt-3 text-white">تريكو أو تيشيرت فاخر مخصص</h1>
                <p class="text-2xl font-extrabold text-indigo-400 mt-2">4500 دج</p>
            </div>

            <!-- زر رفع الشعار -->
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-300">ارفع شعارك أو صورتك للطباعة:</label>
                <label class="flex flex-col items-center justify-center w-full h-24 border-2 border-gray-700 border-dashed rounded-2xl cursor-pointer bg-gray-900/50 hover:bg-gray-800/80 transition">
                    <div class="flex items-center space-x-2 space-x-reverse py-2">
                        <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="text-xs text-gray-300 font-semibold">اضغط لرفع الشعار من جهازك</p>
                    </div>
                    <input type="file" id="logoUpload" accept="image/*" class="hidden" />
                </label>
            </div>

            <!-- نموذج الطلب المتصل بإرسال البريد الإلكتروني -->
            <form action="https://api.web3forms.com/submit" method="POST" id="orderForm" class="space-y-3 pt-1">
                <!-- مفتاح الربط الخاص بك -->
                <input type="hidden" name="access_key" value="4580a521-490f-439f-9f37-ac452ffd6252">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">الاسم الكامل</label>
                    <input type="text" name="name" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white" placeholder="اسمك الكريم">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">رقم الهاتف</label>
                        <input type="tel" name="phone" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white" placeholder="05xxxxxxxx">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">الولاية / العنوان</label>
                        <input type="text" name="address" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white" placeholder="مثال: الشلف">
                    </div>
                </div>

                <!-- حقل مخفي لحالة التصميم -->
                <input type="hidden" name="design_status" id="designStatusInput" value="لم يتم رفع شعار">

                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 text-white font-bold py-3.5 rounded-xl hover:opacity-90 transition shadow-lg shadow-indigo-600/30 text-sm">
                    تأكيد الطلب وإرسال التصميم لمتجرك
                </button>
            </form>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="border-t border-gray-800/80 py-5 text-center text-xs text-gray-500">
        جميع الحقوق محفوظة © 2026 - منصة تريكو وتيشيرت 3D
    </footer>

    <!-- سكربت المجسم الواقعي وطبقة الشعار القابلة للتحكم -->
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 5.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // إضاءة استوديو واقعية
        scene.add(new THREE.AmbientLight(0xffffff, 1.3));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        // بناء مجسم تريكو / تيشيرت واقعي بتفاصيل متناسقة
        const garmentGroup = new THREE.Group();

        const bodyGeo = new THREE.CylinderGeometry(1.05, 1.15, 2.3, 32);
        const clothMaterial = new THREE.MeshStandardMaterial({ color: 0x312e81, roughness: 0.7, metalness: 0.05 });
        const bodyMesh = new THREE.Mesh(bodyGeo, clothMaterial);
        garmentGroup.add(bodyMesh);

        const collarGeo = new THREE.TorusGeometry(0.4, 0.08, 16, 32, Math.PI);
        const collarMesh = new THREE.Mesh(collarGeo, clothMaterial);
        collarMesh.rotation.x = Math.PI / 2;
        collarMesh.position.set(0, 1.15, 0);
        garmentGroup.add(collarMesh);

        const sleeveGeo = new THREE.CylinderGeometry(0.42, 0.38, 1.1, 16);
        const rightSleeve = new THREE.Mesh(sleeveGeo, clothMaterial);
        rightSleeve.rotation.z = Math.PI / 3.5;
        rightSleeve.position.set(1.15, 0.7, 0);
        garmentGroup.add(rightSleeve);

        const leftSleeve = new THREE.Mesh(sleeveGeo, clothMaterial);
        leftSleeve.rotation.z = -Math.PI / 3.5;
        leftSleeve.position.set(-1.15, 0.7, 0);
        garmentGroup.add(leftSleeve);

        scene.add(garmentGroup);

        let logoMesh = null;

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minPolarAngle = Math.PI / 4;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        function changeColor(hex) {
            clothMaterial.color.setHex(hex);
        }

        document.getElementById('logoUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const textureLoader = new THREE.TextureLoader();
                    textureLoader.load(e.target.result, function(texture) {
                        if (logoMesh) garmentGroup.remove(logoMesh);

                        const logoGeo = new THREE.PlaneGeometry(1, 1);
                        const logoMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
                        logoMesh = new THREE.Mesh(logoGeo, logoMat);
                        
                        logoMesh.position.set(0, 0.2, 0.6);
                        garmentGroup.add(logoMesh);

                        document.getElementById('designStatusInput').value = "تم رفع شعار مخصص بنجاح من طرف الزبون";
                        alert('✨ تم رفع الشعار! استخدم أشرطة التحكم أسفل الشاشة لضبط مكانه بدقة.');
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('logoPosX').addEventListener('input', (e) => { if (logoMesh) logoMesh.position.x = parseFloat(e.target.value); });
        document.getElementById('logoPosY').addEventListener('input', (e) => { if (logoMesh) logoMesh.position.y = parseFloat(e.target.value); });
        document.getElementById('logoScale').addEventListener('input', (e) => { const s = parseFloat(e.target.value); if (logoMesh) logoMesh.scale.set(s, s, s); });
        document.getElementById('logoRotate').addEventListener('input', (e) => { if (logoMesh) logoMesh.rotation.z = parseFloat(e.target.value); });
    </script>
</body>
</html>
